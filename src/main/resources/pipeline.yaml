pipeline:
  source:
    type: kafka
    properties:
      bootstrap.servers: localhost:9092
      topic: market-data
      group.id: market-data-etl

  transformations:
    - validate
    - normalize
    - enrich

  sinks:
    - type: kafka
      properties:
        bootstrap.servers: localhost:9092
        topic: market-data-processed

    - type: redis
      properties:
        host: 127.0.0.1
        port: 6379

    - type: postgres
      properties:
        url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
        username: ${POSTGRES_USER}
        password: ${POSTGRES_PASSWORD}
  deadLetterQueue:
    type: kafka
    properties:
      bootstrap.servers: localhost:9092
      topic: market-data-dlq